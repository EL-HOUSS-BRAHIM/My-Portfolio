name: Portfolio quality and immutable images
on:
  push:
    branches: [main, develop]
    paths: ['web/**', 'deploy/**', 'scripts/deploy-portfolio.sh', '.github/workflows/ci-cd.yml']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_environment:
        description: Build only, or deploy after all checks and image scans pass
        type: choice
        options: [build-only, staging, production]
        default: build-only
permissions:
  contents: read
concurrency:
  group: portfolio-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: {POSTGRES_PASSWORD: local-test-only}
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run: {working-directory: web}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: {node-version: '24', cache: npm, cache-dependency-path: web/package-lock.json}
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint -- --max-warnings 0
      - run: npm test
      - run: npm run db:test
        env:
          TEST_DATABASE_URL: postgresql://postgres:local-test-only@localhost:5432/postgres
      - run: npm run build
        env: {CONTENT_MODE: demo, NEXT_TELEMETRY_DISABLED: '1'}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env: {CONTENT_MODE: demo, CI: 'true'}
      - run: npm audit --audit-level=high
      - run: npm --prefix worker audit --audit-level=high
      - uses: actions/upload-artifact@v4
        if: failure()
        with: {name: portfolio-test-results, path: web/test-results, retention-days: 7}
  images:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {environment: staging, suffix: '-staging'}
          - {environment: production, suffix: ''}
    environment: portfolio-${{ matrix.environment }}
    permissions: {contents: read, packages: write, security-events: write}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}'}
      - name: Require target project's public browser configuration
        env:
          PUBLIC_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          PUBLIC_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: test -n "$PUBLIC_URL" && test -n "$PUBLIC_KEY"
      - uses: docker/build-push-action@v6
        with:
          context: web
          target: app
          push: false
          load: true
          tags: ghcr.io/el-houss-brahim/portfolio${{ matrix.suffix }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      - uses: aquasecurity/trivy-action@0.35.0
        with: {image-ref: 'ghcr.io/el-houss-brahim/portfolio${{ matrix.suffix }}:${{ github.sha }}', severity: 'CRITICAL,HIGH', exit-code: '1', ignore-unfixed: true}
      - uses: docker/build-push-action@v6
        with: {context: web, target: worker, push: false, load: true, tags: 'ghcr.io/el-houss-brahim/portfolio-worker${{ matrix.suffix }}:${{ github.sha }}'}
      - uses: aquasecurity/trivy-action@0.35.0
        with: {image-ref: 'ghcr.io/el-houss-brahim/portfolio-worker${{ matrix.suffix }}:${{ github.sha }}', severity: 'CRITICAL,HIGH', exit-code: '1', ignore-unfixed: true}
      - run: |
          docker push ghcr.io/el-houss-brahim/portfolio${{ matrix.suffix }}:${{ github.sha }}
          docker push ghcr.io/el-houss-brahim/portfolio-worker${{ matrix.suffix }}:${{ github.sha }}
  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy_environment != 'build-only'
    needs: [verify, images]
    runs-on: ubuntu-latest
    environment: portfolio-${{ inputs.deploy_environment }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy portfolio without replacing the shared gateway
        env:
          TARGET: ${{ inputs.deploy_environment }}
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_KNOWN_HOSTS: ${{ vars.VPS_KNOWN_HOSTS }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          PORTFOLIO_DOMAIN: ${{ vars.PORTFOLIO_DOMAIN }}
        run: |
          set -Eeuo pipefail
          [[ "$TARGET" =~ ^(staging|production)$ ]]
          [[ "$VPS_HOST" =~ ^[a-zA-Z0-9.-]+$ && "$VPS_USER" = budgetify ]]
          [[ "$PORTFOLIO_DOMAIN" =~ ^[a-z0-9][a-z0-9.-]+\.[a-z]{2,}$ ]]
          test -n "$VPS_KNOWN_HOSTS" && test -n "$VPS_SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/portfolio_key
          chmod 600 ~/.ssh/portfolio_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          trap 'rm -f ~/.ssh/portfolio_key release.env' EXIT
          suffix=''
          if [[ "$TARGET" = staging ]]; then suffix='-staging'; fi
          {
            printf 'DEPLOY_ENV=%s\n' "$TARGET"
            printf 'PORTFOLIO_DOMAIN=%s\n' "$PORTFOLIO_DOMAIN"
            printf 'PORTFOLIO_IMAGE=ghcr.io/el-houss-brahim/portfolio%s:%s\n' "$suffix" "$GITHUB_SHA"
            printf 'PORTFOLIO_WORKER_IMAGE=ghcr.io/el-houss-brahim/portfolio-worker%s:%s\n' "$suffix" "$GITHUB_SHA"
            printf 'PORTFOLIO_SECRETS_FILE=/home/budgetify/portfolio/secrets/%s.env\n' "$TARGET"
            if [[ "$TARGET" = staging ]]; then printf 'PORTFOLIO_CURL_CONFIG=/home/budgetify/portfolio/secrets/staging-curl.conf\n'; fi
          } > release.env
          remote="$VPS_USER@$VPS_HOST"
          ssh -i ~/.ssh/portfolio_key -o BatchMode=yes -o StrictHostKeyChecking=yes "$remote" 'mkdir -p /home/budgetify/portfolio/incoming /home/budgetify/portfolio/releases'
          scp -i ~/.ssh/portfolio_key -o BatchMode=yes -o StrictHostKeyChecking=yes scripts/deploy-portfolio.sh deploy/compose.yaml release.env "$remote:/home/budgetify/portfolio/incoming/"
          ssh -i ~/.ssh/portfolio_key -o BatchMode=yes -o StrictHostKeyChecking=yes "$remote" "install -m 600 /home/budgetify/portfolio/incoming/compose.yaml /home/budgetify/portfolio/compose.yaml && install -m 600 /home/budgetify/portfolio/incoming/release.env /home/budgetify/portfolio/releases/$TARGET-$GITHUB_SHA.env && bash /home/budgetify/portfolio/incoming/deploy-portfolio.sh /home/budgetify/portfolio/releases/$TARGET-$GITHUB_SHA.env"
# Configure environment credentials, DNS, independent Supabase projects, and the
# documented shared-gateway integration before selecting a deployment target.
